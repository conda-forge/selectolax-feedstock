{% set version = "1.0.1" %}

package:
  name: selectolax
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/s/selectolax/selectolax-{{ version }}.tar.gz
  sha256: ee75a63d06fa8a821c802eb34c57be62017fdd058b48636e2f75dd3315438adf

build:
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  build:
    - {{ compiler("c") }}
    - {{ stdlib("c") }}
    - cross-python_{{ target_platform }}     # [build_platform != target_platform]
    - cython                                 # [build_platform != target_platform]
    - python                                 # [build_platform != target_platform]
  host:
    - cython
    - pip
    - python
    - setuptools
  run:
    - cython ==3.0.11
    - python

test:
  imports:
    - selectolax
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/rushter/selectolax
  summary: Fast HTML5 parser with CSS selectors.
  license: Apache-2.0 AND LGPL-2.1-only AND MIT
  license_file:
    - LICENSE
    - lexbor/LICENSE
    - lexbor/NOTICE
  doc_url: https://selectolax.readthedocs.io

extra:
  recipe-maintainers:
    - rxm7706
    - soapy1
